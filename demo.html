<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Reset cơ bản */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: sans-serif;
    overflow-x: hidden; /* Ẩn phần trang login đang nằm ngoài màn hình bên phải */
}

.main-container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* Định dạng chung cho các trang */
.page {
    width: 100%;
    height: 100%;
}

/* Trang Index */
.index-page {
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Trang Login - Ban đầu ẩn hoàn toàn bên phải màn hình */
.login-page {
    position: fixed;
    top: 0;
    left: 0;
    background-color: #ffffff; /* Hoặc màu tối tùy giao diện của bạn */
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* Đẩy toàn bộ trang login sang phải 100% chiều rộng màn hình */
    transform: translateX(100%); 
    
    /* Tạo hiệu ứng mượt mà khi thay đổi transform trong 0.5 giây */
    transition: transform 0.5s ease-in-out; 
    z-index: 999; /* Đảm bảo nó đè lên trên trang index */
}

/* Class này sẽ được thêm vào bằng JavaScript để kích hoạt hiệu ứng trượt vào */
.login-page.active {
    transform: translateX(0);
}

/* Một vài CSS phụ cho nút bấm và form */
.content {
    text-align: center;
}
button {
    padding: 10px 20px;
    margin-top: 15px;
    cursor: pointer;
}
.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
}
    </style>
</head>
<body>

    <div class="main-container">
        <section class="page index-page">
            <div class="content">
                <h1>Chào mừng đến với Website</h1>
                <p>Đây là trang index hiện tại của bạn.</p>
                <button id="open-login-btn">Đăng nhập ngay</button>
            </div>
        </section>

        <section class="page login-page" id="loginPage">
            <div class="content">
                <button id="close-login-btn" class="back-btn">← Quay lại</button>
                
                <h2>Đăng nhập</h2>
                <form>
                    <input type="text" placeholder="Tên đăng nhập"><br>
                    <input type="password" placeholder="Mật khẩu"><br>
                    <button type="submit">Xác nhận</button>
                </form>
            </div>
        </section>
    </div>

    <script>
        // Lấy các phần tử từ DOM
const openLoginBtn = document.getElementById('open-login-btn');
const closeLoginBtn = document.getElementById('close-login-btn');
const loginPage = document.getElementById('loginPage');

// Khi click vào nút Đăng nhập trên trang index
openLoginBtn.addEventListener('click', () => {
    loginPage.classList.add('active'); // Thêm class để kích hoạt transform: translateX(0)
});

// Khi click vào nút Quay lại trên trang login
closeLoginBtn.addEventListener('click', () => {
    loginPage.classList.remove('active'); // Xóa class để trang login trượt ngược về bên phải
});
    </script>
</body>
</html>
