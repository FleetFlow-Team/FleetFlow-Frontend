<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Nhập Tối Giản</title>
    <style>
        /* --- Reset cơ bản --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* --- Nền trang web (Background) --- */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dùng ảnh hoặc gradient làm nền để thấy rõ hiệu ứng blur */
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        /* Nút mở đăng nhập ở ngoài cùng */
        .btn-open {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-open:hover { background-color: #555; }

        /* --- Lớp phủ làm mờ (Overlay Blur) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.3); /* Nền đen mờ */
            backdrop-filter: blur(8px); /* HIỆU ỨNG BLUR BACKGROUND Ở ĐÂY */
            
            /* Căn giữa hộp đăng nhập */
            display: flex;
            justify-content: center;
            align-items: center;

            /* Trạng thái ẩn mặc định */
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        /* Class được thêm vào bằng JS để hiện Modal */
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- Hộp thoại Đăng nhập --- */
        .login-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
            
            /* Hiệu ứng trượt nhẹ từ trên xuống khi hiện */
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .login-box {
            transform: translateY(0);
        }

        .login-box h2 { margin-bottom: 20px; color: #333; }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-submit:hover { background-color: #0056b3; }

        .btn-close {
            display: inline-block;
            margin-top: 15px;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <button class="btn-open" id="openBtn">Đăng Nhập</button>

    <div class="modal-overlay" id="loginModal">
        <div class="login-box">
            <h2>Đăng Nhập</h2>
            <input type="text" placeholder="Tên đăng nhập" required>
            <input type="password" placeholder="Mật khẩu" required>
            <button class="btn-submit">Vào</button>
            <span class="btn-close" id="closeBtn">Đóng</span>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const modal = document.getElementById('loginModal');

        // Bắt sự kiện click vào nút Đăng nhập -> Thêm class 'active'
        openBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        // Bắt sự kiện click vào nút Đóng -> Xóa class 'active'
        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Tính năng phụ: Click ra ngoài vùng trắng (click vào background) cũng đóng form
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>

</body>
</html>
