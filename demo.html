<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pure Liquid Glass Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ================= RESET & BASE ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050505;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ================= BACKGROUND HIỆU ỨNG ================= 
           Tạo các đốm sáng Neon chuyển động phía sau để 
           thấy rõ hiệu ứng khúc xạ của kính mờ (Glassmorphism) 
        ======================================================== */
    .bg-orbs {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      animation: float 10s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 200px;
      height: 200px;
      background: #38bdf8;
      /* Xanh Neon tương lai */
      top: 60%;
      left: 10%;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: #8b5cf6;
      /* Tím High-end */
      bottom: -50px;
      right: 5%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(30px, -50px) scale(1.2);
      }
    }

    /* ================= KHUNG ĐIỆN THOẠI ================= */
    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* ================= LIQUID GLASS NAVBAR ================= */
    .liquid-nav {
      position: relative;
      margin: 0 20px 40px;
      /* Cách đáy và 2 bên */
      height: 75px;

      /* Kính trong suốt & Độ mờ sâu */
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);

      /* Viền bắt sáng ở cạnh trên tạo độ nổi của kính */
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1.5px solid rgba(255, 255, 255, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);

      border-radius: 40px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5),
        inset 0 2px 10px rgba(255, 255, 255, 0.05);

      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    /* ================= LIQUID INDICATOR ================= 
           Khối tròn di chuyển ôm lấy icon 
        ======================================================= */
    .indicator {
      position: absolute;
      top: 50%;
      width: 90px;
      height: 55px;
      margin-top: -27.5px;
      /* Căn giữa theo chiều dọc */

      background: rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.4),
        0 5px 15px rgba(0, 0, 0, 0.2);

      /* Chuyển động GPU siêu mượt, gia tốc lò xo */
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
      pointer-events: none;
      /* Không cản sự kiện click */
    }

    /* ================= NAV ITEMS ================= */
    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.4s ease;
    }

    /* Chỉ dùng thẻ <i> với icon */
    .nav-item i {
      font-size: 1.3rem;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Trạng thái Active */
    .nav-item.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Icon nảy lên nhẹ và to ra khi được chọn */
    .nav-item.active i {
      transform: scale(1.2);
      color: rgba(56, 151, 56, 0.887);
      text-shadow: 0 0 15px rgba(223, 233, 223, 0.591);
    }

    /* Hiệu ứng lún xuống khi nhấn giữ */
    .nav-item:active i {
      transform: scale(0.85);
    }
  </style>
</head>

<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="app-container">

    <nav class="liquid-nav" id="navbar">
      <div class="indicator" id="indicator"></div>

      <div class="nav-item active" data-index="0">
        <i class="fa-solid fa-house"></i>
      </div>

      <div class="nav-item" data-index="1">
        <i class="fa-solid fa-compass"></i>
      </div>

      <div class="nav-item" data-index="2">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <div class="nav-item" data-index="3">
        <i class="fa-solid fa-gear"></i>
      </div>
    </nav>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const nav = document.getElementById("navbar");
      const navItems = document.querySelectorAll(".nav-item");
      const indicator = document.getElementById("indicator");

      // Hàm di chuyển indicator đến icon được chọn
      function moveIndicator(item) {
        const navRect = nav.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();

        // Tính toán vị trí trục X để căn giữa khối tròn 55px vào giữa thẻ icon
        // Công thức: (Vị trí icon so với viewport - Vị trí nav so với viewport) + (Chiều rộng icon - Kích thước indicator)/2
        const indicatorWidth = indicator.offsetWidth; // Tự động lấy đúng 90px (hoặc kích thước thật từ CSS)

        const offsetLeft = (itemRect.left - navRect.left) + (itemRect.width - indicatorWidth) / 2 - 10;

        // Sử dụng transform translateX thay vì left để tối ưu FPS (Hardware Acceleration)
        indicator.style.transform = `translateX(${offsetLeft}px)`;
      }

      const activeItem = document.querySelector(".nav-item.active");
      if (activeItem) {
        // Đợi render xong để lấy kích thước chuẩn
        requestAnimationFrame(() => moveIndicator(activeItem));
      }

      // Lắng nghe sự kiện Click
      navItems.forEach(item => {
        item.addEventListener("click", () => {
          // Xóa trạng thái active cũ
          document.querySelector(".nav-item.active").classList.remove("active");

          // Thêm trạng thái active mới
          item.classList.add("active");

          // Kích hoạt chuyển động
          moveIndicator(item);
        });
      });

      // Tự động căn chỉnh lại nếu màn hình thay đổi kích thước
      window.addEventListener("resize", () => {
        const currentActive = document.querySelector(".nav-item.active");
        if (currentActive) {
          requestAnimationFrame(() => moveIndicator(currentActive));
        }
      });
    });
  </script>
</body>

</html>
