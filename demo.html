<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel Xe - Liquid Glass Effect</title>
  <style>
    /* RESET CƠ BẢN */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* SECTION VỚI BACKGROUND NỔI BẬT */
    .car-showcase-section {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Background sâu và sang trọng */
      overflow: hidden;
      position: relative;
    }

    /* Thêm chút hiệu ứng ánh sáng nền */
    .car-showcase-section::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 200, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .car-showcase-section::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 100, 100, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* CONTAINER CHỨA CAROUSEL */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 500px;
    }

    /* LIQUID GLASS CARD */
    .car-card {
      position: absolute;
      top: 50%;
      width: 50%;
      max-width: 600px;
      height: 350px;
      
      /* Hiệu ứng kính lỏng (Liquid Glass) */
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      
      /* Căn giữa nội dung bên trong kính */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      
      /* Hiệu ứng chuyển động mượt mà */
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    .car-card img {
      width: 100%;
      height: 80%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.5s ease;
    }

    .car-card h3 {
      margin-top: 15px;
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* TRẠNG THÁI CỦA CÁC THẺ */

    /* Thẻ ở giữa (Active) */
    .car-card.active {
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 10;
      opacity: 1;
      pointer-events: none; /* Không cần click vào thẻ đang active */
    }

    /* Thẻ bên phải (Chỉ hiện ~30%) */
    .car-card.next {
      left: 85%; /* Đẩy sang phải, chỉ lộ một phần */
      transform: translate(-50%, -50%) scale(0.8);
      z-index: 5;
      opacity: 0.6;
      cursor: pointer; /* Hiển thị con trỏ tay để báo hiệu có thể click */
    }

    /* Thẻ bên trái (Chỉ hiện ~30%) */
    .car-card.prev {
      left: 15%; /* Đẩy sang trái, chỉ lộ một phần */
      transform: translate(-50%, -50%) scale(0.8);
      z-index: 5;
      opacity: 0.6;
      cursor: pointer;
    }

    /* Hiệu ứng hover khi đưa chuột vào phần xe bị khuất */
    .car-card.next:hover, .car-card.prev:hover {
      opacity: 0.9;
      transform: translate(-50%, -50%) scale(0.82);
    }

    /* Các thẻ ẩn hoàn toàn bên ngoài màn hình */
    .car-card.hidden-right {
      left: 120%;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    .car-card.hidden-left {
      left: -20%;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <section class="car-showcase-section">
    <div class="carousel-container" id="carousel">
      <div class="car-card" onclick="handleClick(0)">
        <img src="https://images.unsplash.com/photo-1503376760367-13eea3625346?q=80&w=800&auto=format&fit=crop" alt="Xe số 1">
        <h3>Sedan Đen</h3>
      </div>
      <div class="car-card" onclick="handleClick(1)">
        <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?q=80&w=800&auto=format&fit=crop" alt="Xe số 2">
        <h3>Thể thao Đỏ</h3>
      </div>
      <div class="car-card" onclick="handleClick(2)">
        <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=800&auto=format&fit=crop" alt="Xe số 3">
        <h3>Siêu xe Xanh</h3>
      </div>
      <div class="car-card" onclick="handleClick(3)">
        <img src="https://images.unsplash.com/photo-1542362567-b07e54358753?q=80&w=800&auto=format&fit=crop" alt="Xe số 4">
        <h3>Cổ điển Xám</h3>
      </div>
      <div class="car-card" onclick="handleClick(4)">
        <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?q=80&w=800&auto=format&fit=crop" alt="Xe số 5">
        <h3>SUV Trắng</h3>
      </div>
    </div>
  </section>

  <script>
    const cards = document.querySelectorAll('.car-card');
    let currentIndex = 0; // Vị trí xe đầu tiên

    function updateCarousel() {
      cards.forEach((card, index) => {
        // Reset tất cả các class
        card.classList.remove('active', 'next', 'prev', 'hidden-left', 'hidden-right');

        // Phân bổ lại class dựa trên khoảng cách tới currentIndex
        if (index === currentIndex) {
          card.classList.add('active');
        } else if (index === currentIndex + 1 || (currentIndex === cards.length - 1 && index === 0)) {
          // Xử lý cả trường hợp vòng lặp (chiếc cuối về chiếc đầu)
          card.classList.add('next');
        } else if (index === currentIndex - 1 || (currentIndex === 0 && index === cards.length - 1)) {
          card.classList.add('prev');
        } else {
          // Các thẻ còn lại sẽ bị đẩy ra ngoài
          if (index > currentIndex) {
             card.classList.add('hidden-right');
          } else {
             card.classList.add('hidden-left');
          }
        }
      });
    }

    // Hàm xử lý sự kiện click
    function handleClick(index) {
      // Chỉ cho phép chuyển nếu click vào thẻ next hoặc prev
      const clickedCard = cards[index];
      if (clickedCard.classList.contains('next') || clickedCard.classList.contains('prev')) {
        currentIndex = index;
        updateCarousel();
      }
    }

    // Khởi tạo trạng thái ban đầu
    updateCarousel();
  </script>

</body>
</html>
