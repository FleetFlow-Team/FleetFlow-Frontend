<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - 404 Không tìm thấy trang</title>

    <!-- Nạp Font Inter (mặc định) và Playfair Display (cho Tiêu đề giống ảnh mẫu) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    
    <style>
        /* =========================================
           404 ERROR PAGE - BỐ CỤC 2 CỘT (CĂN CHUẨN MẪU)
        ========================================= */
        .error-universe {
            /* Background tối với ánh sáng mờ từ dưới lên */
            background: radial-gradient(circle at bottom center, #2a2d34 0%, #111111 60%, #000000 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
            padding: 40px 0;
        }

        .error-container {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }

        /* Tên thương hiệu nhỏ ở trên (Chữ in hoa, nhỏ, đậm) */
        .brand-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 50px;
            display: block;
        }

        /* Tiêu đề chính "Đến lúc chơi trốn tìm" - Dùng font Serif */
        .error-title {
            font-family: 'Playfair Display', serif; /* Font Serif sang trọng giống ảnh mẫu */
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 40px;
            color: #ffffff;
        }

        /* Phụ đề giải thích */
        .error-desc {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #d1d5db; /* Màu xám sáng */
            line-height: 1.8;
            margin-bottom: 0;
        }

        /* Cột phải: GIF và Nút */
        .error-visual-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Hình ảnh GIF 404 */
        .error-gif {
            width: 100%;
            max-width: 350px; /* Kích thước cân đối với cột trái */
            height: auto;
            margin-bottom: 40px;
            mix-blend-mode: screen; /* Giúp viền GIF đen chìm vào nền hoàn hảo */
        }

        /* Nút quay về trang chủ - Phong cách viền trong suốt */
        .btn-futuristic {
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px; /* Bo góc vuông vức hơn một chút giống ảnh mẫu */
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-futuristic:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Responsive Mobile */
        @media (max-width: 991px) {
            .error-universe { padding: 60px 0; }
            .error-title { font-size: 3rem; margin-bottom: 20px; }
            .brand-subtitle { margin-bottom: 30px; }
            .error-desc { margin-bottom: 50px; }
            .error-gif { max-width: 250px; margin-bottom: 30px; }
            .col-lg-6.text-start { text-align: center !important; }
        }
    </style>
</head>
<body>
    <!-- 404 ERROR CONTENT - 2 COLUMNS LAYOUT -->
    <main class="error-universe">
        <div class="error-container">
            <div class="row align-items-center">
                
                <!-- CỘT TRÁI: Nội dung văn bản -->
                <div class="col-lg-6 text-start mb-5 mb-lg-0 pe-lg-5">
                    <img src="../assets/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="login-logo mb-4" style="width: 100%; height: auto;">
                    
                    <h1 class="error-title">
                        Oops! <br>Trang bạn tìm đã "đi lạc".
                    </h1>
                    
                    <p class="error-desc">
                        Đừng lo, bạn có thể quay lại Trang chủ và tiếp tục trải nghiệm dịch vụ tuyệt vời của chúng tôi nhé!
                    </p>
                </div>

                <!-- CỘT PHẢI: Hình ảnh GIF và Nút điều hướng -->
                <div class="col-lg-6 error-visual-col">
                    <img src="../assets/img/404.gif" alt="404 Error GIF" class="error-gif">                    
                    <a href="../index.html" class="btn-futuristic">
                        Trở về trang chủ FleetFlow
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
