<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - 403 Truy cập bị từ chối</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    
    <style>
        /* =========================================
           403 ERROR PAGE - BỐ CỤC CĂN GIỮA (THEO MẪU)
        ========================================= */
        .error-universe {
            background: radial-gradient(circle at bottom center, #2a2d34 0%, #111111 60%, #000000 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
            padding: 40px 20px;
        }

        .error-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mã lỗi 403 to, sử dụng font Inter để phẳng và hiện đại */
        .error-title {
            font-family: 'Inter', sans-serif;
            font-size: 7rem;
            font-weight: 500;
            line-height: 1;
            color: #ffffff;
            margin: 0;
            letter-spacing: -2px;
        }

        /* Phụ đề giải thích */
        .error-desc {
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem;
            font-weight: 400;
            color: #d1d5db; 
            line-height: 1.6;
            margin: 0;
            max-width: 450px;
            text-align: left;
        }

        /* Dải phân cách giữa Số 403 và Chữ mô tả (Chỉ hiện trên màn hình lớn) */
        .error-header-block {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 50px;
        }

        .error-divider {
            width: 2px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Hình ảnh lính gác (Graphic) */
        .error-graphic {
            width: 100%;
            max-width: 450px;
            height: auto;
            margin-bottom: 50px;
            mix-blend-mode: screen; /* Giúp lọc nền đen của ảnh nếu có */
        }

        /* Nút quay về trang chủ */
        .btn-futuristic {
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 36px;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-futuristic:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .error-header-block {
                flex-direction: column;
                gap: 20px;
            }
            .error-divider {
                display: none; /* Ẩn dải phân cách trên mobile */
            }
            .error-title {
                font-size: 5.5rem;
            }
            .error-desc {
                text-align: center;
                font-size: 1rem;
            }
            .error-graphic {
                max-width: 300px;
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <main class="error-universe">
        <div class="error-container">
            
            <div class="error-header-block">
                <h1 class="error-title">403</h1>
                
                <div class="error-divider"></div>
                
                <p class="error-desc">
                    Rất xin lỗi, có vẻ như bạn không có quyền truy cập vào trang này. Vui lòng kiểm tra lại quyền đăng nhập hoặc đăng nhập tài khoản khác nhé!
                </p>
            </div>

            <div>
                <img src="../assets/img/403.png" alt="Truy cập bị từ chối" class="error-graphic">
            </div>

            <div>
                <a href="../index.html" class="btn-futuristic">
                    Trở về trang chủ
                </a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
</body>
</html>
