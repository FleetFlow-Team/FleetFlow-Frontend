<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - 500 Lỗi Máy Chủ</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">

    <style>
        /* =========================================
           500 ERROR PAGE - CĂN GIỮA (CENTERED)
        ========================================= */
        .error-universe {
            /* Nền tối gradient, pha thêm chút ánh đỏ tía mờ ảo dưới đáy biểu thị cảnh báo server */
            background: radial-gradient(circle at bottom center, #3a2222 0%, #1a1c1a 50%, #000000 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
            padding: 40px 20px;
        }

        .error-container {
            max-width: 750px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mã lỗi 500 Typography */
        .error-code {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Bánh răng xoay thay cho số 0 ở giữa */
        .gear-icon {
            color: #e53e3e;
            /* Đỏ cảnh báo */
            font-size: 12rem;
            margin: 0 10px;
            animation: spin-stutter 4s infinite;
            filter: drop-shadow(0 0 15px rgba(229, 62, 62, 0.4));
        }

        /* Hiệu ứng bánh răng xoay bị kẹt (phù hợp với lỗi 500) */
        @keyframes spin-stutter {
            0% {
                transform: rotate(0deg);
            }

            30% {
                transform: rotate(180deg);
            }

            40% {
                transform: rotate(170deg);
            }

            /* Giật lùi lại chút */
            70% {
                transform: rotate(360deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Tiêu đề chính */
        .error-title {
            font-family: 'Inter', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            color: #ffffff;
        }

        /* Phụ đề giải thích */
        .error-desc {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: #d1d5db;
            line-height: 1.7;
            margin: 0 auto 40px auto;
            max-width: 550px;
        }

        /* =========================================
           NÚT BẤM (BUTTONS)
        ========================================= */
        .error-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        /* Nút Reload */
        .btn-reload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            background-color: #e53e3e;
            /* Màu đỏ cảnh báo */
            border: none;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-reload:hover {
            background-color: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 62, 62, 0.3);
            color: #ffffff;
        }

        /* Nút Outline Home */
        .btn-futuristic {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-futuristic:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* Responsive Mobile */
        @media (max-width: 576px) {
            .error-code {
                font-size: 6rem;
            }

            .gear-icon {
                font-size: 4.5rem;
            }

            .error-title {
                font-size: 1.6rem;
            }

            .error-desc {
                font-size: 1rem;
                padding: 0 10px;
            }

            .error-buttons {
                flex-direction: column;
                gap: 12px;
            }

            .btn-reload,
            .btn-futuristic {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <main class="error-universe">
        <div class="error-container">

            <div class="error-code">
                <span>5</span>
                <i class="fa-solid fa-gear gear-icon" title="Động cơ lỗi"></i>
                <span>0</span>
            </div>

            <h1 class="error-title">Lỗi Máy Chủ Nội Bộ</h1>

            <p class="error-desc">
                Hệ thống máy chủ của FleetFlow đang gặp sự cố. Đội ngũ kỹ sư của chúng tôi đã nhận được cảnh báo và đang
                dốc sức sửa chữa.
                <br> Vui lòng thử lại sau ít phút!
            </p>

            <div class="error-buttons">
                <a href="javascript:window.location.reload();" class="btn-reload">
                    <i class="fa-solid fa-rotate-right me-2"></i> Tải lại trang
                </a>

                <a href="../index.html" class="btn-futuristic">
                    <i class="fa-solid fa-house me-2"></i> Trở về Trang chủ
                </a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
</body>

</html>
