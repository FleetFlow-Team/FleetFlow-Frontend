<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetFlow - Hồ sơ cá nhân</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <link rel="stylesheet" href="../style/pages/profile.css" />
    <link rel="stylesheet" href="../style/base.css" />
  </head>
  <body>
    <nav class="navbar custom-navbar sticky-top">
        <div class="container-base">
            <a class="navbar-brand brand-overflow" href="index.html">
                <img src="../assets/img/logo1.jpg" alt="Logo" class="logo-img" />
            </a>
            <div class="user-profile">
                <div class="notification-bell"><i class="fa-regular fa-bell"></i></div>
                <div class="fw-bold ms-2">Tiến Dũng</div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="glass-panel profile-sidebar p-4 reveal-on-scroll delay-1">
            <div class="user-avatar-box text-center mb-4">
              <div class="avatar-wrapper position-relative d-inline-block">
                <img src="https://ui-avatars.com/api/?name=Tien+Dung&background=00B14F&color=fff" class="avatar-img" />
                <label for="avatarInput" class="avatar-edit-btn position-absolute"><i class="fa-solid fa-camera"></i></label>
              </div>
              <h6 class="fw-bold mt-3">Tiến Dũng</h6>
            </div>

            <div class="nav flex-column nav-pills gap-2" id="v-pills-tab" role="tablist">
              <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#content-profile"><i class="fa-regular fa-user me-2"></i> Thông tin cá nhân</button>
              <button class="nav-link" data-bs-toggle="pill" data-bs-target="#content-ekyc"><i class="fa-solid fa-shield-halved me-2"></i> Xác thực eKYC</button>
              <button class="nav-link" data-bs-toggle="pill" data-bs-target="#content-security"><i class="fa-solid fa-lock me-2"></i> Đổi mật khẩu</button>
            </div>
          </div>
        </aside>

        <section class="col-lg-9">
          <div class="glass-panel profile-content tab-content p-4 reveal-on-scroll delay-2" id="v-pills-tabContent">
            
            <div class="tab-pane fade show active" id="content-profile">
              <h4 class="fw-bold mb-4">Thông tin cá nhân</h4>
              <form class="row g-4">
                <div class="col-md-6 form-floating-custom">
                    <input type="text" class="form-control custom-input" id="name" value="Trần Tiến Dũng" placeholder=" ">
                    <label for="name">Họ và tên</label>
                </div>
                <div class="col-md-6 form-floating-custom">
                    <input type="tel" class="form-control custom-input" value="0987654321" readonly placeholder=" ">
                    <label>Số điện thoại</label>
                </div>
                <div class="col-md-6 form-floating-custom">
                    <input type="email" class="form-control custom-input" id="email" value="dungtt@example.com" placeholder=" ">
                    <label for="email">Email</label>
                </div>
                <div class="col-md-6 form-floating-custom">
                    <input type="date" class="form-control custom-input" id="dob" value="2005-01-01" placeholder=" ">
                    <label for="dob">Ngày sinh</label>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn-login px-5">Lưu thay đổi</button>
                </div>
              </form>
            </div>

            <div class="tab-pane fade" id="content-ekyc">
                <h4 class="fw-bold mb-4">Xác minh danh tính (eKYC)</h4>
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="upload-box" onclick="document.getElementById('idFront').click()">
                            <i class="fa-regular fa-id-card mb-2"></i> <div>CCCD Mặt trước</div>
                        </div>
                        <input type="file" id="idFront" class="d-none">
                    </div>
                    <div class="col-md-6">
                        <div class="upload-box" onclick="document.getElementById('idBack').click()">
                            <i class="fa-solid fa-address-card mb-2"></i> <div>CCCD Mặt sau</div>
                        </div>
                        <input type="file" id="idBack" class="d-none">
                    </div>
                </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/base.js"></script>
  </body>
</html>
