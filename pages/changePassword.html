<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - Đổi mật khẩu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/register.css">
    
    
</head>
<body>

    <div class="login-wrapper d-flex align-items-center position-relative overflow-hidden">
        <div class="bg-overlay"></div>
        
        <div class="container position-relative z-1">
            <div class="row align-items-start justify-content-center gap-lg-4">
                
                <div class="col-lg-5 text-white login-content-left mb-5 mb-lg-0 ps-lg-4">
                    <div class="reveal-on-scroll delay-1">
                        <img src="../assets/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="login-logo mb-4">
                    </div>
                    
                    <div class="reveal-on-scroll delay-2">
                        <h1 class="login-heading fw-bold mb-0">Đổi mật khẩu</h1>
                        <h2 class="login-subheading fw-normal mb-4">bảo mật tài khoản</h2>
                         
                        <a href="../index.html" class="forgot-pwd-link d-inline-block mt-3 text-decoration-none">
                            <i class="fa-solid fa-arrow-left-long me-2"></i> Quay lại trang Đăng nhập
                        </a>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="login-card reveal-on-scroll delay-3">
                        <h3 class="login-card-title fw-bold">Thiết lập<br>Mật khẩu mới</h3>
                        
                        <form action="#" method="POST" class="mt-4">
                            <div class="form-floating-custom mb-4">
                                <input type="password" class="form-control custom-input" id="oldPassword" placeholder=" " required>
                                <label for="oldPassword">Mật khẩu hiện tại</label>
                            </div>
                            
                            <div class="form-floating-custom mb-4">
                                <input type="password" class="form-control custom-input" id="newPassword" placeholder=" " required>
                                <label for="newPassword">Mật khẩu mới</label>
                            </div>

                            <div class="form-floating-custom mb-5">
                                <input type="password" class="form-control custom-input" id="confirmPassword" placeholder=" " required>
                                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                            </div>
                            
                            <button type="submit" class="btn-login w-100 fs-5 mt-2">
                                Cập nhật mật khẩu
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="../js/base.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
