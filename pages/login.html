<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - Đăng nhập hệ thống</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/pages/login.css">
</head>
<body>

    <main class="login-wrapper d-flex align-items-center" style="background-image: url('../assets/img/login-background.png');">
        
        <div class="container">
            <div class="row align-items-start justify-content-center gap-lg-4">
                
                <div class="col-lg-5 text-white login-content-left mb-5 mb-lg-0 ps-lg-4">
                    <img src="../assets/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="login-logo mb-4">
                    
                    <h1 class="login-heading fw-bold mb-0">Đăng nhập</h1>
                    <h2 class="login-subheading fw-normal mb-5">để tiếp tục</h2>
                     
                    <a href="register.html" class="forgot-pwd-link d-inline-block mt-3">
                        Bạn chưa có tài khoản? Đăng kí ngay!
                    </a>
                </div>

                <div class="col-lg-5">
                    <div class="login-card shadow-lg">
                        <h3 class="login-card-title fw-bold">Đăng nhập<br>FleetFlow</h3>
                        
                        <form action="#" method="POST" class="mt-4">
                            <div class="mb-4">
                                <label for="email" class="form-label custom-label text-uppercase">Email</label>
                                <input type="email" class="form-control custom-input" id="email" required>
                            </div>
                            
                            <div class="mb-5">
                                <label for="password" class="form-label custom-label text-uppercase">Mật khẩu</label>
                                <input type="password" class="form-control custom-input" id="password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-login-submit w-100">
                                Đăng nhập
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
