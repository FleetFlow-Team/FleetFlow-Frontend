<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - Đăng nhập hệ thống</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/pages/login.css">
    
    <script src="../js/base.js" defer></script>
</head>
<body>

    <main class="login-wrapper d-flex align-items-center position-relative overflow-hidden">
    
    <video autoplay loop muted playsinline class="bg-video">
        <source src="../assets/video/login-video.mp4" type="video/mp4">
        </video>

    <div class="bg-overlay"></div>
    
    <div class="container position-relative z-1">
        <div class="row align-items-start justify-content-center gap-lg-4">
            
            <div class="col-lg-5 text-white login-content-left mb-5 mb-lg-0 ps-lg-4">
                <div class="reveal-on-scroll delay-1">
                    <img src="../assets/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="login-logo mb-4">
                </div>
                
                <div class="reveal-on-scroll delay-2">
                    <h1 class="login-heading fw-bold mb-0">Đăng nhập</h1>
                    <h2 class="login-subheading fw-normal mb-4">để tiếp tục</h2>
                     
                    <a href="register.html" class="forgot-pwd-link d-inline-block mt-3">
                        Bạn chưa có tài khoản? Đăng kí ngay!
                    </a>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="login-card reveal-on-scroll delay-3">
                    <h3 class="login-card-title fw-bold">Đăng nhập<br>FleetFlow</h3>
                    
                    <form action="#" method="POST" class="mt-4">
                        <div class="form-floating-custom mb-4">
                            <input type="email" class="form-control custom-input" id="email" placeholder=" " required>
                            <label for="email">Email đăng nhập</label>
                        </div>
                        
                        <div class="form-floating-custom mb-5">
                            <input type="password" class="form-control custom-input" id="password" placeholder=" " required>
                            <label for="password">Mật khẩu</label>
                        </div>
                        
                        <button type="submit" class="btn-login w-100 fs-5 mt-2">
                            Đăng nhập
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
