<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - Quên mật khẩu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/register.css">
</head>
<body>

    <div class="login-wrapper d-flex align-items-center position-relative overflow-hidden">
        <div class="bg-overlay"></div>
        
        <div class="container position-relative z-1">
            <div class="row align-items-center justify-content-center py-5">
                
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="glass-form-container p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="../index.html">
                                <img src="../assets/img/FleetFlow - Logo-removebg-preview.png" alt="FleetFlow Logo" class="mb-3" style="max-height: 50px;">
                            </a>
                            <h2 class="fw-bold text-dark">Khôi phục mật khẩu</h2>
                            <p class="text-muted" style="font-size: 0.9rem;">
                                Vui lòng nhập địa chỉ email đã đăng ký. Hệ thống sẽ cấp lại một mật khẩu tạm thời vào hòm thư của bạn.
                            </p>
                        </div>

                        <form id="forgotPasswordForm">
                            <div class="form-floating-custom mb-4">
                                <input type="email" class="form-control custom-input" id="email" placeholder=" " required>
                                <label for="email">Email đăng nhập</label>
                            </div>
                            
                            <button type="submit" id="btnSubmitForgot" class="btn-login w-100 fs-5 mt-2">
                                Gửi mật khẩu tạm thời
                            </button>

                            <div class="text-center mt-4">
                                <a href="../index.html" class="text-decoration-none fw-medium" style="color: var(--color-1);">
                                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById('forgotPasswordForm');
            const btnSubmit = document.getElementById('btnSubmitForgot');

            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault(); // Ngăn form tự reload

                    const email = document.getElementById('email').value.trim();

                    // Hiệu ứng Loading kính mờ
                    const originalText = btnSubmit.innerHTML;
                    btnSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Đang xử lý...';
                    btnSubmit.disabled = true;

                    // Đóng gói dữ liệu (chỉ cần gửi email)
                    const formData = new URLSearchParams();
                    formData.append('email', email);

                    try {
                        // Gọi API tới ForgotPasswordController.java
                        const response = await fetch('http://localhost:8080/FleetFlow/api/v1/auth/forgot-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData.toString()
                        });

                        const data = await response.json();

                        if (data.success) {
                            // Controller trả về message "Mật khẩu tạm thời đã gửi vào hòm thư."
                            alert("Thành công: " + data.message);
                            form.reset();
                            
                            // Đẩy người dùng về trang chủ để họ mở Modal Đăng nhập bằng pass mới
                            window.location.href = '../index.html';
                        } else {
                            // Báo lỗi (VD: Email không tồn tại)
                            alert("Thất bại: " + data.message);
                        }
                    } catch (error) {
                        console.error("Lỗi kết nối Backend:", error);
                        alert("Không thể kết nối tới máy chủ. Vui lòng kiểm tra lại server NetBeans.");
                    } finally {
                        // Phục hồi nút bấm
                        btnSubmit.innerHTML = originalText;
                        btnSubmit.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
