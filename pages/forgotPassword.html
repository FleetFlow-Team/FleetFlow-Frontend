<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - Quên mật khẩu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/register.css">
</head>
<body>

    <div class="login-wrapper d-flex align-items-center position-relative overflow-hidden">
    <div class="bg-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 0;"></div>
    
    <div class="container position-relative z-1">
        <div class="row align-items-center justify-content-center py-5">
            
            <div class="col-12 col-md-8 col-lg-5">
                <div class="login-card reveal-on-scroll is-visible p-4 p-md-5">
                    
                    <div class="text-center mb-4 text-white">
                        <a href="../index.html">
                            <img src="../assets/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="mb-4" style="max-height: 60px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));">
                        </a>
                        <h2 class="login-card-title fw-bold mb-2">Khôi phục mật khẩu</h2>
                        <p style="font-size: 0.95rem; color: rgba(255, 255, 255, 0.75); line-height: 1.6;">
                            Vui lòng nhập địa chỉ email đã đăng ký. Hệ thống sẽ cấp lại một mật khẩu tạm thời vào hòm thư của bạn.
                        </p>
                    </div>

                    <form id="forgotPasswordForm" class="mt-4">
                        <div class="form-floating-custom mb-4">
                            <input type="email" class="form-control custom-input" id="email" placeholder=" " required>
                            <label for="email">Email đăng nhập</label>
                        </div>
                        
                        <button type="submit" id="btnSubmitForgot" class="btn-login w-100 fs-5 mt-2 d-flex justify-content-center align-items-center gap-2">
                            <span>Gửi mật khẩu tạm thời</span>
                        </button>

                        <div class="text-center mt-5">
                            <a href="../index.html" class="forgot-pwd-link d-inline-flex align-items-center gap-2" >
                                </i>Quay lại trang chủ
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById('forgotPasswordForm');
        const btnSubmit = document.getElementById('btnSubmitForgot');

        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault(); 

                const email = document.getElementById('email').value.trim();

                // Lưu lại nội dung gốc của nút
                const originalContent = btnSubmit.innerHTML;
                
                // Trạng thái Loading: Vô hiệu hóa nút, đổi UI
                btnSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Đang xử lý...</span>';
                btnSubmit.disabled = true;
                btnSubmit.style.opacity = '0.8';
                btnSubmit.style.cursor = 'not-allowed';

                const formData = new URLSearchParams();
                formData.append('email', email);

                try {
                    // Cấu hình URL gọi tới Servlet
                    const apiUrl = 'http://localhost:8080/FleetFlow/api/v1/auth/forgot-password';
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData.toString()
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert("Thành công: " + data.message);
                        form.reset();
                        window.location.href = '../index.html'; // Điều hướng về trang chủ
                    } else {
                        alert("Lỗi: " + data.message);
                        // Focus lại vào ô email để người dùng nhập lại dễ dàng
                        document.getElementById('email').focus();
                    }
                } catch (error) {
                    console.error("Lỗi kết nối Backend:", error);
                    alert("Hệ thống đang bảo trì hoặc mất kết nối máy chủ. Vui lòng thử lại sau.");
                } finally {
                    // Trả lại trạng thái ban đầu cho nút bấm
                    btnSubmit.innerHTML = originalContent;
                    btnSubmit.disabled = false;
                    btnSubmit.style.opacity = '1';
                    btnSubmit.style.cursor = 'pointer';
                }
            });
        }
    });
</script>
    <script src="../js/api.js"></script>
</body>
</html>
