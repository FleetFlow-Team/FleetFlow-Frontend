<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetFlow - Tạo tài khoản mới</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" /> 

    <link rel="stylesheet" href="../style/base.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    <link rel="stylesheet" href="../style/pages/login.css" />
    <link rel="stylesheet" href="../style/register.css" />
    
    <script src="../js/base.js" defer></script>
  </head>
  <body>

    <main class="login-wrapper d-flex align-items-center">
      <div class="container">
        <div class="row align-items-center justify-content-center gap-lg-4 py-5">
          
          <div class="col-lg-5 text-white login-content-left mb-5 mb-lg-0 ps-lg-4">
            <div class="reveal-on-scroll delay-1">
                <img src="../assets/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="login-logo mb-4" />
            </div>

            <div class="reveal-on-scroll delay-2">
                <h1 class="login-heading fw-bold mb-0">Tạo</h1>
                <h2 class="login-subheading fw-normal mb-5">Tài khoản mới</h2>
    
                <div class="mt-3 text-white" style="font-size: 1.15rem; font-weight: 500">
                  Bạn đã có tài khoản?
                  <a href="login.html" class="forgot-pwd-link">Đăng nhập ngay</a>
                </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="login-card reveal-on-scroll delay-3">
              <h3 class="login-card-title fw-bold">
                Tạo tài khoản<br />FleetFlow
              </h3>

              <form action="#" method="POST" class="mt-4" id="registerForm">
                
                <div class="form-floating-custom mb-3">
                  <input type="text" class="form-control custom-input" id="name" placeholder=" " required />
                  <label for="name">Họ và Tên</label>
                </div>

                <div class="form-floating-custom mb-3">
                  <input type="email" class="form-control custom-input" id="email" placeholder=" " required />
                  <label for="email">Email đăng nhập</label>
                </div>

                <div class="form-floating-custom mb-3">
                  <input type="password" class="form-control custom-input" id="password" placeholder=" " required />
                  <label for="password">Mật khẩu</label>
                </div>

                <div class="form-floating-custom mb-4">
                  <input type="password" class="form-control custom-input" id="rePassword" placeholder=" " required />
                  <label for="rePassword">Nhập lại Mật khẩu</label>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-6">
                    <select class="form-select custom-input custom-select-fixed" id="gender" required>
                      <option value="" disabled selected>Giới tính</option>
                      <option value="male">Nam</option>
                      <option value="female">Nữ</option>
                      <option value="other">Khác</option>
                    </select>
                  </div>

                  <div class="col-6">
                    <select name="yob" class="form-select custom-input custom-select-fixed" id="yob" required>
                      <option value="" disabled selected>Chọn năm</option>
                      </select>
                  </div>
                </div>

                <button type="submit" class="btn-login w-100 fs-5 mt-2">
                  Đăng kí tài khoản
                </button>
              </form>
            </div>
          </div>
          
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
