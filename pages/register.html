<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetFlow - Tạo tài khoản mới</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    /> 

    <link rel="stylesheet" href="../style/base.css" />
    <link rel="icon" type="image/jpeg" href="../assets/img/FleetFlow - Logo.png">
    
    <link rel="stylesheet" href="../style/pages/login.css" />
  </head>
  <body>
    <main
      class="login-wrapper d-flex align-items-center"
      style="
        background-image: url('../assets/img/login-background.png');
        min-height: 100vh;
      "
    >
      <div class="container">
        <div class="row align-items-center justify-content-center gap-lg-4 py-5">
          <div class="col-lg-5 text-white login-content-left mb-5 mb-lg-0 ps-lg-4">
            <img
              src="../assets/img/FleetFlow_-_Logo-removebg-preview.png"
              alt="FleetFlow Logo"
              class="login-logo mb-4"
            />

            <h1 class="login-heading fw-bold mb-0">Tạo</h1>
            <h2 class="login-subheading fw-normal mb-5">Tài khoản mới</h2>

            <div
              class="mt-3 text-white"
              style="font-size: 1.15rem; font-weight: 500"
            >
              Bạn đã có tài khoản?
              <a href="login.html" class="forgot-pwd-link">Đăng nhập ngay</a>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="login-card shadow-lg">
              <h3 class="login-card-title fw-bold">
                Tạo tài khoản<br />FleetFlow
              </h3>

              <form action="#" method="POST" class="mt-4" id="registerForm">
                <div class="mb-3">
                  <label for="name" class="form-label custom-label text-uppercase">Họ và Tên</label>
                  <input
                    type="text"
                    class="form-control custom-input"
                    id="name"
                    placeholder="Nguyễn Văn A"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label custom-label text-uppercase">Email</label>
                  <input
                    type="email"
                    class="form-control custom-input"
                    id="email"
                    placeholder="example@fleetflow.vn"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label custom-label text-uppercase">Mật khẩu</label>
                  <input
                    type="password"
                    class="form-control custom-input"
                    id="password"
                    placeholder="*************"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="rePassword" class="form-label custom-label text-uppercase">Nhập lại Mật khẩu</label>
                  <input
                    type="password"
                    class="form-control custom-input"
                    id="rePassword"
                    placeholder="*************"
                    required
                  />
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-6">
                    <label for="gender" class="form-label custom-label text-uppercase">Giới tính</label>
                    <select
                      class="form-select custom-input custom-select-arrow"
                      id="gender"
                      required
                    >
                      <option value="" disabled selected>Chọn giới tính</option>
                      <option value="male">Nam</option>
                      <option value="female">Nữ</option>
                      <option value="other">Khác</option>
                    </select>
                  </div>

                  <div class="col-6">
                    <label for="yob" class="form-label custom-label text-uppercase">Năm sinh</label>
                    <select name="yob" class="form-select custom-input custom-select-arrow" id="yob" required>
                      <option value="" disabled selected>Chọn năm</option>
                    </select>
                  </div>
                </div>

                <button type="submit" class="btn btn-login-submit w-100 mt-2">
                  Đăng kí
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
